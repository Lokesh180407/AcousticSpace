services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: acoustic
      POSTGRES_PASSWORD: acoustic
      POSTGRES_DB: acoustic_space
    ports:
      - "5432:5432"
    volumes:
      - acoustic_pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://acoustic:acoustic@db:5432/acoustic_space
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      UPLOADS_BASE_PATH: /app/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

volumes:
  acoustic_pgdata:

